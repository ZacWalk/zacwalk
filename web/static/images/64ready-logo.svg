<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 499">
  <title>64Ready</title>
  <!--
    The 64Ready logo: a Commodore 64 drifting down under a parachute.

    The canopy is the C64's case badge sewn into a dome: the badge's warm grey,
    its five stripes in badge order, curved to follow the canopy's outline,
    and its "64". The background is
    transparent, so the logo sits on any page colour; the cords are dark with
    a light core so they show on dark and light pages alike.

    The C64 is a breadbin: its side profile, traced from a photo of the real
    machine, swept along its width. Taller at the back than the front, its
    top rolls over in a large rounded edge into a short front face, and its
    back rolls over into the top in a smaller one, so the curves run the
    length of the machine and show at its ends; the seam
    between its top and bottom shells runs along the left end and the front.
    Its top is drawn as a flat plan in key
    units (1 = one key pitch). Width projects to (14,-3.95), deck depth to
    (7.6,8.5), and physical height straight up. Both end profiles and every
    row of keys share those axes. Each key
    is a tapered keycap: a dark footprint on the plate, the front and left
    faces this view shows, and a smaller top face raised above it. The case
    badge carries the C= logo, "commodore", the stripes and "64", as on the
    real machine.
  -->
  <defs>
    <path id="canopy" d="M4 170C4 78.32 87.27 4 190 4C292.73 4 376 78.32 376 170Q343.82 139.1 311.64 166.2Q275.28 146.2 238.92 166.2Q190 126.2 141.08 166.2Q104.72 146.2 68.36 166.2Q36.18 139.1 4 170Z"/>
    <clipPath id="canopy-clip"><use href="#canopy"/></clipPath>
    <path id="cords" d="M4 170L165.82 340.488M68.36 166.2L177.02 337.327M141.08 166.2L185.42 334.957M238.92 166.2L193.82 332.587M311.64 166.2L206.42 329.032M376 170L227.42 323.108"/>
    <path id="case" d="M11.824 380.44L305.824 297.49Q306.736 296.11 309.928 299.68L374.68 372.1Q382.28 380.6 382.28 387.6V396.4Q382.28 400.8 378.1 396.125L84.1 479.075L14.18 410.175Q10 405.5 10 400L10 383Q10 380 11.824 380.44Z"/>
    <!-- Lit from above: darker where the back rolls away, flat on the top, a
         highlight as the bullnose rolls over, darker down the front and its
         rounded underside -->
    <linearGradient id="case-shade" gradientUnits="userSpaceOnUse" x1="14" y1="378" x2="47" y2="495">
      <stop offset="0" stop-color="#C2BAAC"/>
      <stop offset="0.04" stop-color="#DAD4C8"/>
