      <stop offset="0.83" stop-color="#E6E1D8"/>
      <stop offset="0.91" stop-color="#D3CCBF"/>
      <stop offset="1" stop-color="#ABA395"/>
      <stop offset="1" stop-color="#9C9486"/>
    </linearGradient>
